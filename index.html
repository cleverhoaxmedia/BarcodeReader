<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Merch Stand</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+English&display=swap');

    :root {
      --bg:       #1a1410;
      --surface:  #231d17;
      --surface2: #2d2520;
      --border:   #4a3828;
      --gold:     #c9962a;
      --gold-hi:  #e8b84b;
      --text:     #e8dcc8;
      --dim:      #8a7a62;
      --green:    #4caf50;
      --red:      #c0392b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'IM Fell English', serif;
      min-height: 100dvh; display: flex; flex-direction: column;
    }

    header {
      background: var(--surface); border-bottom: 2px solid var(--gold);
      padding: 14px 20px; text-align: center; flex-shrink: 0;
    }
    header h1 { font-family: 'Cinzel', serif; font-size: 1.3rem; color: var(--gold-hi); letter-spacing: 0.1em; }
    header p  { font-size: 0.78rem; color: var(--dim); margin-top: 2px; }

    nav { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    nav button {
      flex: 1; padding: 11px 4px; background: none; border: none;
      color: var(--dim); font-family: 'Cinzel', serif; font-size: 0.68rem;
      letter-spacing: 0.08em; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    nav button.active { color: var(--gold-hi); border-bottom-color: var(--gold); }

    .view { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding: 16px; gap: 12px; }
    .view.active { display: flex; }

    /* ── BUTTONS ── */
    .btn-primary {
      width: 100%; padding: 13px; background: var(--gold); border: none; border-radius: 6px;
      font-family: 'Cinzel', serif; font-size: 0.85rem; font-weight: 700;
      color: var(--bg); cursor: pointer; letter-spacing: 0.08em;
    }
    .btn-primary:active { background: var(--gold-hi); }
    .btn-green {
      width: 100%; padding: 13px; background: var(--green); border: none; border-radius: 6px;
      font-family: 'Cinzel', serif; font-size: 0.85rem; font-weight: 700;
      color: #fff; cursor: pointer; letter-spacing: 0.06em;
    }
    .btn-outline {
      width: 100%; padding: 11px; background: none; border: 2px solid var(--gold);
      border-radius: 6px; font-family: 'Cinzel', serif; font-size: 0.82rem;
      color: var(--gold-hi); cursor: pointer; letter-spacing: 0.08em;
    }
    .btn-outline:active { background: var(--gold); color: var(--bg); }
    .btn-ghost {
      width: 100%; padding: 10px; background: none; border: 1px solid var(--border);
      border-radius: 6px; font-family: 'Cinzel', serif; font-size: 0.72rem;
      color: var(--dim); cursor: pointer;
    }
    .btn-danger {
      width: 100%; padding: 10px; background: none; border: 1px solid var(--red);
      border-radius: 6px; font-family: 'Cinzel', serif; font-size: 0.72rem;
      color: var(--red); cursor: pointer;
    }

    /* ── SCANNER ── */
    #scanner-view { align-items: center; }

    #camera-wrap {
      position: relative; width: 100%; max-width: 360px;
      border-radius: 8px; overflow: hidden; border: 2px solid var(--border);
      background: #000; aspect-ratio: 1;
    }
    #preview { width: 100%; height: 100%; object-fit: cover; display: block; }
    #scan-canvas { display: none; }

    .scan-frame { position: absolute; inset: 0; pointer-events: none; }
    .scan-frame::before, .scan-frame::after,
    .scan-frame span::before, .scan-frame span::after {
      content: ''; position: absolute; width: 28px; height: 28px;
      border-color: var(--gold); border-style: solid;
    }
    .scan-frame::before      { top: 18px; left: 18px;  border-width: 3px 0 0 3px; }
    .scan-frame::after       { top: 18px; right: 18px; border-width: 3px 3px 0 0; }
    .scan-frame span::before { bottom: 18px; left: 18px;  border-width: 0 0 3px 3px; }
    .scan-frame span::after  { bottom: 18px; right: 18px; border-width: 0 3px 3px 0; }

    #scan-status { font-size: 0.9rem; color: var(--dim); text-align: center; min-height: 1.4em; }

    #txn-bar {
      width: 100%; max-width: 360px; background: var(--surface);
      border: 1px solid var(--gold); border-radius: 8px;
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .txn-label { font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--dim); letter-spacing: 0.08em; }
    .txn-total { font-size: 1.6rem; color: var(--gold-hi); line-height: 1; }
    .txn-count { font-size: 0.72rem; color: var(--dim); margin-top: 2px; }
    #checkout-btn {
      padding: 12px 18px; background: var(--green); border: none; border-radius: 6px;
      font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 700;
      color: #fff; cursor: pointer; white-space: nowrap;
    }
    #checkout-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    #checkout-btn:not(:disabled):active { filter: brightness(0.85); }

    /* ── MODALS ── */
    .modal {
      position: fixed; inset: 0; background: rgba(26,20,16,0.95);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px; gap: 12px; z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal.show { opacity: 1; pointer-events: all; }
    .modal h2 { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--gold-hi); }

    /* Sale flash */
    #sale-flash .flash-sku   { font-size: 0.78rem; color: var(--dim); }
    #sale-flash .flash-name  { font-family: 'Cinzel', serif; font-size: 2rem; color: var(--gold-hi); }
    #sale-flash .flash-price { font-size: 1.4rem; color: var(--text); }
    .flash-btns { display: flex; gap: 10px; width: 100%; max-width: 360px; margin-top: 8px; }
    .flash-btns .btn-green { flex: 2; }
    .flash-btns .btn-ghost { flex: 1; }
    .qty-stepper {
      display: flex; align-items: center; gap: 0;
      border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    }
    .qty-stepper button {
      width: 44px; height: 44px; background: var(--surface2); border: none;
      color: var(--gold-hi); font-size: 1.4rem; cursor: pointer; line-height: 1;
    }
    .qty-stepper button:active { background: var(--border); }
    .qty-stepper input {
      width: 52px; height: 44px; background: var(--bg); border: none;
      color: var(--text); font-family: 'Cinzel', serif; font-size: 1.1rem;
      text-align: center;
    }
    /* hide number input spinners */
    .qty-stepper input::-webkit-outer-spin-button,
    .qty-stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .qty-stepper input[type=number] { -moz-appearance: textfield; }

    /* Checkout modal */
    .checkout-items {
      width: 100%; max-width: 360px; max-height: 40vh;
      overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    }
    .checkout-row {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .cr-name  { font-size: 0.95rem; }
    .cr-qty   { font-size: 0.72rem; color: var(--dim); margin-top: 2px; }
    .cr-price { font-size: 1.05rem; color: var(--gold-hi); }
    .checkout-total-row {
      width: 100%; max-width: 360px;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--gold); padding-top: 12px;
      font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--gold-hi);
    }
    .modal-btns { display: flex; gap: 10px; width: 100%; max-width: 360px; }

    /* Add item modal */
    .modal-field { width: 100%; max-width: 360px; }
    .modal-field label {
      display: block; font-size: 0.72rem; color: var(--dim);
      margin-bottom: 6px; letter-spacing: 0.06em;
    }
    .modal-field input {
      width: 100%; padding: 12px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-family: 'IM Fell English', serif; font-size: 1rem;
    }
    .sku-preview { font-size: 0.72rem; color: var(--dim); margin-top: 6px; }

    /* ── ITEMS VIEW ── */
    .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .item-card-header {
      padding: 14px 16px; display: flex; justify-content: space-between;
      align-items: center; cursor: pointer;
    }
    .iname  { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--gold-hi); }
    .isku   { font-size: 0.7rem; color: var(--dim); margin-top: 2px; }
    .iprice { font-size: 1.1rem; }
    .item-card-body { display: none; padding: 14px 16px; border-top: 1px solid var(--border); flex-direction: column; gap: 12px; }
    .item-card-body.open { display: flex; }
    .qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .qr-label { font-size: 0.72rem; color: var(--dim); }
    .price-edit-row { display: flex; gap: 8px; }
    .price-edit-row input {
      flex: 1; padding: 10px 12px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-family: 'IM Fell English', serif; font-size: 1rem;
    }
    .price-edit-row .save-btn {
      padding: 10px 16px; background: var(--gold); border: none; border-radius: 6px;
      font-family: 'Cinzel', serif; font-size: 0.75rem; font-weight: 700;
      color: var(--bg); cursor: pointer;
    }

    /* ── LOG VIEW ── */
    .log-summary {
      background: var(--surface); border: 1px solid var(--gold); border-radius: 8px;
      padding: 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .slabel { font-family: 'Cinzel', serif; font-size: 0.72rem; color: var(--dim); letter-spacing: 0.08em; }
    .svalue { font-size: 1.6rem; color: var(--gold-hi); }

    .txn-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .txn-card-header {
      padding: 12px 16px; display: flex; justify-content: space-between;
      align-items: center; cursor: pointer;
    }
    .txn-id   { font-family: 'Cinzel', serif; font-size: 0.9rem; color: var(--gold-hi); }
    .txn-time { font-size: 0.7rem; color: var(--dim); margin-top: 2px; }
    .txn-rev  { font-size: 1.05rem; color: var(--text); }
    .txn-card-body { display: none; padding: 12px 16px; border-top: 1px solid var(--border); flex-direction: column; gap: 6px; }
    .txn-card-body.open { display: flex; }
    .txn-line {
      display: flex; justify-content: space-between; font-size: 0.88rem; padding: 4px 0;
      border-bottom: 1px solid var(--border);
    }
    .txn-line:last-child { border-bottom: none; }
    .txn-line .tl-dim { color: var(--dim); }

    .empty-state { text-align: center; color: var(--dim); font-size: 0.9rem; padding: 40px 20px; }
    .version-mark { text-align: center; padding: 16px; font-size: 1.4rem; opacity: 0.35; }
  </style>
</head>
<body>

<header>
  <h1>⚔ Merch Stand</h1>
  <p>Scan · Log · Export</p>
</header>

<nav>
  <button class="active" data-view="scanner">SCANNER</button>
  <button data-view="items">ITEMS</button>
  <button data-view="log">SALES LOG</button>
</nav>

<!-- SCANNER VIEW -->
<div id="scanner-view" class="view active">
  <div id="camera-wrap">
    <video id="preview" playsinline autoplay muted></video>
    <canvas id="scan-canvas"></canvas>
    <div class="scan-frame"><span></span></div>
  </div>
  <button class="btn-primary" id="start-btn" onclick="startCamera()">Start Camera</button>
  <div id="scan-status">Tap Start Camera to begin scanning</div>
  <div id="txn-bar">
    <div>
      <div class="txn-label">TRANSACTION</div>
      <div class="txn-total" id="txn-total">$0.00</div>
      <div class="txn-count" id="txn-count">0 items</div>
    </div>
    <button id="checkout-btn" onclick="openCheckout()" disabled>Checkout</button>
  </div>
</div>

<!-- ITEMS VIEW -->
<div id="items-view" class="view">
  <div id="item-list"></div>
  <button class="btn-outline" onclick="openAddModal()">+ Add New Item</button>
</div>

<!-- LOG VIEW -->
<div id="log-view" class="view">
  <div class="log-summary">
    <div><div class="slabel">TRANSACTIONS</div><div class="svalue" id="log-txn-count">0</div></div>
    <div style="text-align:right"><div class="slabel">REVENUE</div><div class="svalue" id="log-revenue">$0.00</div></div>
  </div>
  <button class="btn-outline" onclick="exportCSV()">⬇ Export Sales CSV</button>
  <div id="txn-list"></div>
  <button class="btn-ghost" onclick="clearLog()">Clear All Sales Data</button>
</div>

<!-- SALE FLASH MODAL -->
<div id="sale-flash" class="modal">
  <div class="flash-sku"   id="flash-sku"></div>
  <div class="flash-name"  id="flash-name"></div>
  <div class="flash-price" id="flash-price"></div>
  <div class="qty-stepper">
    <button onclick="adjustQty(-1)">−</button>
    <input id="flash-qty" type="number" value="1" min="1" />
    <button onclick="adjustQty(1)">+</button>
  </div>
  <div class="flash-btns">
    <button class="btn-green" onclick="addToTransaction()">+ Add to Transaction</button>
    <button class="btn-ghost" onclick="dismissFlash()">Cancel</button>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div id="checkout-modal" class="modal">
  <h2>Checkout</h2>
  <div class="checkout-items" id="checkout-items"></div>
  <div class="checkout-total-row">
    <span>Total</span>
    <span id="checkout-total"></span>
  </div>
  <div class="modal-btns">
    <button class="btn-green"  onclick="saveTransaction()" style="flex:2">Save Transaction</button>
    <button class="btn-ghost"  onclick="closeCheckout()"   style="flex:1">Cancel</button>
  </div>
  <button class="btn-danger" onclick="voidTransaction()">Void Transaction</button>
</div>

<!-- ADD ITEM MODAL -->
<div id="add-modal" class="modal">
  <h2>New Item</h2>
  <div class="modal-field">
    <label>ITEM NAME</label>
    <input id="new-name" type="text" placeholder="e.g. Coffee Mug" oninput="previewSKU()" />
    <div class="sku-preview" id="sku-preview">SKU: —</div>
  </div>
  <div class="modal-field">
    <label>PRICE ($)</label>
    <input id="new-price" type="number" min="0" step="0.01" placeholder="0.00" />
  </div>
  <div class="modal-btns">
    <button class="btn-primary" onclick="addItem()" style="flex:2">Add Item</button>
    <button class="btn-ghost"   onclick="closeAddModal()" style="flex:1">Cancel</button>
  </div>
</div>

<div class="version-mark">🦑</div>

<script>
  // ── STATE ──
  const DEFAULTS = [
    { sku: 'SWORD',  name: 'Sword',  price: 2.00 },
    { sku: 'POTION', name: 'Potion', price: 1.50 },
    { sku: 'ARROWS', name: 'Arrows', price: 0.50 },
  ];

  let items       = JSON.parse(localStorage.getItem('merch_items') || 'null') || DEFAULTS;
  let sales       = JSON.parse(localStorage.getItem('merch_sales') || '[]'); // array of transaction objects
  let transaction = [];
  let pendingItem = null;
  let scanning    = false;
  let lastScanTime = 0;
  let detector    = null;

  function saveItems() { localStorage.setItem('merch_items', JSON.stringify(items)); }
  function saveSales() { localStorage.setItem('merch_sales', JSON.stringify(sales)); }
  function getItem(sku) { return items.find(i => i.sku === sku); }

  // ── LEAVE WARNING ──
  window.addEventListener('beforeunload', e => {
    e.preventDefault();
    e.returnValue = '';
  });

  // ── NAV ──
  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.view + '-view').classList.add('active');
      if (btn.dataset.view === 'items') renderItems();
      if (btn.dataset.view === 'log')   renderLog();
    });
  });

  // ── SCANNER ──
  async function startCamera() {
    if (!('BarcodeDetector' in window)) {
      document.getElementById('scan-status').textContent = 'BarcodeDetector not supported on this browser.';
      return;
    }
    detector = new BarcodeDetector({ formats: ['qr_code'] });
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 } }
      });
      document.getElementById('preview').srcObject = stream;
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('scan-status').textContent = 'Scanning…';
      scanning = true;
      setTimeout(tick, 200);
    } catch {
      document.getElementById('scan-status').textContent = 'Camera access denied.';
    }
  }

  async function tick() {
    if (!scanning) return;
    const video = document.getElementById('preview');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      try {
        const codes = await detector.detect(video);
        if (codes.length > 0 && Date.now() - lastScanTime > 2000) {
          lastScanTime = Date.now();
          handleScan(codes[0].rawValue.trim().toUpperCase());
        }
      } catch { /* frame skip */ }
    }
    setTimeout(tick, 200);
  }

  function handleScan(sku) {
    const item = getItem(sku);
    if (!item) { document.getElementById('scan-status').textContent = `Unknown: ${sku}`; return; }
    pendingItem = item;
    document.getElementById('flash-sku').textContent   = sku;
    document.getElementById('flash-name').textContent  = item.name;
    document.getElementById('flash-price').textContent = '$' + item.price.toFixed(2);
    document.getElementById('sale-flash').classList.add('show');
  }

  function dismissFlash() {
    document.getElementById('sale-flash').classList.remove('show');
    document.getElementById('flash-qty').value = 1;
    pendingItem = null;
  }

  // ── TRANSACTION ──
  function txnTotal() { return transaction.reduce((s, i) => s + i.price, 0); }

  function updateTxnBar() {
    const n = transaction.length;
    document.getElementById('txn-total').textContent = '$' + txnTotal().toFixed(2);
    document.getElementById('txn-count').textContent = n === 1 ? '1 item' : `${n} items`;
    document.getElementById('checkout-btn').disabled  = n === 0;
  }

  function adjustQty(delta) {
    const input = document.getElementById('flash-qty');
    input.value = Math.max(1, parseInt(input.value || 1) + delta);
  }

  function addToTransaction() {
    if (!pendingItem) return;
    const qty = Math.max(1, parseInt(document.getElementById('flash-qty').value) || 1);
    for (let i = 0; i < qty; i++) {
      transaction.push({ sku: pendingItem.sku, name: pendingItem.name, price: pendingItem.price });
    }
    updateTxnBar();
    const name = pendingItem.name;
    dismissFlash();
    document.getElementById('scan-status').textContent = `+ ${qty > 1 ? qty + 'x ' : ''}${name} added`;
    setTimeout(() => { if (scanning) document.getElementById('scan-status').textContent = 'Scanning…'; }, 1200);
  }

  function openCheckout() {
    const grouped = groupItems(transaction);
    document.getElementById('checkout-items').innerHTML = grouped.map(g => `
      <div class="checkout-row">
        <div><div class="cr-name">${g.name}</div><div class="cr-qty">x${g.qty} @ $${g.price.toFixed(2)}</div></div>
        <div class="cr-price">$${(g.price * g.qty).toFixed(2)}</div>
      </div>`).join('');
    document.getElementById('checkout-total').textContent = '$' + txnTotal().toFixed(2);
    document.getElementById('checkout-modal').classList.add('show');
  }

  function closeCheckout() { document.getElementById('checkout-modal').classList.remove('show'); }

  function generateTxnId() {
    const now = new Date();
    const mmdd = String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
    const prefix = mmdd + '-';
    const todayCount = sales.filter(t => t.txnId && t.txnId.startsWith(prefix)).length;
    return prefix + String(todayCount + 1).padStart(2, '0');
  }

  function saveTransaction() {
    const txnId = generateTxnId();
    const time  = new Date().toISOString();
    sales.push({ txnId, time, items: groupItems(transaction) });
    saveSales();
    transaction = [];
    updateTxnBar();
    closeCheckout();
    document.getElementById('scan-status').textContent = `✓ ${txnId} saved!`;
    setTimeout(() => { if (scanning) document.getElementById('scan-status').textContent = 'Scanning…'; }, 1500);
  }

  function voidTransaction() {
    if (!confirm('Void this transaction? All scanned items will be lost.')) return;
    transaction = [];
    updateTxnBar();
    closeCheckout();
    document.getElementById('scan-status').textContent = 'Transaction voided.';
    setTimeout(() => { if (scanning) document.getElementById('scan-status').textContent = 'Scanning…'; }, 1500);
  }

  function groupItems(arr) {
    const map = {};
    arr.forEach(i => {
      if (!map[i.sku]) map[i.sku] = { sku: i.sku, name: i.name, price: i.price, qty: 0 };
      map[i.sku].qty++;
    });
    return Object.values(map);
  }

  // ── ITEMS ──
  function renderItems() {
    const list = document.getElementById('item-list');
    list.innerHTML = '';
    items.forEach(item => {
      const sold = sales.reduce((n, t) => n + t.items.filter(i => i.sku === item.sku).reduce((s, i) => s + i.qty, 0), 0);
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `
        <div class="item-card-header" onclick="toggleItemCard(this, '${item.sku}')">
          <div>
            <div class="iname">${item.name}</div>
            <div class="isku">SKU: ${item.sku} &middot; ${sold} sold</div>
          </div>
          <div class="iprice">$${item.price.toFixed(2)}</div>
        </div>
        <div class="item-card-body">
          <div class="qr-wrap">
            <div id="qr-${item.sku}"></div>
            <div class="qr-label">Encodes: ${item.sku}</div>
          </div>
          <div>
            <div style="font-size:0.78rem;color:var(--dim);margin-bottom:6px;">Edit Price</div>
            <div class="price-edit-row">
              <input type="number" min="0" step="0.01" value="${item.price.toFixed(2)}" id="price-${item.sku}" />
              <button class="save-btn" onclick="updatePrice('${item.sku}')">Save</button>
            </div>
          </div>
        </div>`;
      list.appendChild(card);
    });
  }

  function toggleItemCard(header, sku) {
    const body = header.nextElementSibling;
    const isOpen = body.classList.toggle('open');
    if (isOpen) {
      const el = document.getElementById('qr-' + sku);
      if (el && !el.hasChildNodes()) {
        new QRCode(el, { text: sku, width: 160, height: 160, colorDark: '#e8dcc8', colorLight: '#1a1410' });
      }
    }
  }

  function updatePrice(sku) {
    const val = parseFloat(document.getElementById('price-' + sku).value);
    if (isNaN(val) || val < 0) { alert('Invalid price.'); return; }
    getItem(sku).price = val;
    saveItems();
    renderItems();
  }

  // ── ADD ITEM ──
  function generateSKU(name) {
    const base = name.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7);
    let sku = base, n = 1;
    while (items.find(i => i.sku === sku)) { sku = base + (++n); }
    return sku;
  }

  function previewSKU() {
    const name = document.getElementById('new-name').value.trim();
    document.getElementById('sku-preview').textContent = name ? 'SKU: ' + generateSKU(name) : 'SKU: —';
  }

  function openAddModal()  { document.getElementById('add-modal').classList.add('show'); }
  function closeAddModal() {
    document.getElementById('add-modal').classList.remove('show');
    document.getElementById('new-name').value  = '';
    document.getElementById('new-price').value = '';
    document.getElementById('sku-preview').textContent = 'SKU: —';
  }

  function addItem() {
    const name  = document.getElementById('new-name').value.trim();
    const price = parseFloat(document.getElementById('new-price').value);
    if (!name)                   { alert('Enter an item name.');   return; }
    if (isNaN(price) || price < 0) { alert('Enter a valid price.'); return; }
    items.push({ sku: generateSKU(name), name, price });
    saveItems();
    closeAddModal();
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelector('[data-view="items"]').classList.add('active');
    document.getElementById('items-view').classList.add('active');
    renderItems();
  }

  // ── LOG ──
  function renderLog() {
    const totalRev = sales.filter(t => t.txnId && t.items).reduce((s, t) => s + t.items.reduce((r, i) => r + i.price * i.qty, 0), 0);
    document.getElementById('log-txn-count').textContent = sales.length;
    document.getElementById('log-revenue').textContent   = '$' + totalRev.toFixed(2);

    const list = document.getElementById('txn-list');
    if (!sales.length) { list.innerHTML = '<div class="empty-state">No transactions yet.</div>'; return; }

    const sorted = [...sales].filter(t => t.txnId && t.items).sort((a, b) => a.txnId.localeCompare(b.txnId)).reverse();
    list.innerHTML = sorted.map(t => {
      const rev  = t.items.reduce((s, i) => s + i.price * i.qty, 0);
      const time = new Date(t.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const lines = t.items.map(i =>
        `<div class="txn-line">
          <span>${i.name} <span class="tl-dim">x${i.qty}</span></span>
          <span>$${(i.price * i.qty).toFixed(2)}</span>
        </div>`).join('');
      return `
        <div class="txn-card">
          <div class="txn-card-header" onclick="this.nextElementSibling.classList.toggle('open')">
            <div>
              <div class="txn-id">${t.txnId}</div>
              <div class="txn-time">${time}</div>
            </div>
            <div class="txn-rev">$${rev.toFixed(2)}</div>
          </div>
          <div class="txn-card-body">${lines}</div>
        </div>`;
    }).join('');
  }

  function exportCSV() {
    if (!sales.length) { alert('No sales to export.'); return; }
    const sorted = [...sales].filter(t => t.txnId && t.items).sort((a, b) => a.txnId.localeCompare(b.txnId));
    const rows = [['Transaction', 'Time', 'Item', 'SKU', 'Qty', 'Unit Price', 'Line Total']];
    sorted.forEach(t => {
      t.items.forEach(i => {
        rows.push([t.txnId, t.time, i.name, i.sku, i.qty, i.price.toFixed(2), (i.price * i.qty).toFixed(2)]);
      });
    });
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(rows.map(r => r.join(',')).join('\n'));
    const suffix = Math.random().toString(36).slice(2, 7).toUpperCase();
    a.download = 'sales_' + new Date().toISOString().slice(0, 10) + '_' + suffix + '.csv';
    a.click();
  }

  function clearLog() {
    if (!confirm('Clear ALL sales data? This cannot be undone.')) return;
    sales = []; saveSales(); renderLog();
  }
</script>
</body>
</html>
