<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Merch Stand POS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap');

    :root {
      --bg:       #f4f5f7;
      --surface:  #ffffff;
      --border:   #d0d5dd;
      --border-hi:#a0aab8;
      --ink:      #0f1923;
      --ink-mid:  #3d4f61;
      --ink-dim:  #6b7f94;
      --teal:     #0a7ea4;
      --teal-hi:  #0993c2;
      --teal-dim: #d0edf6;
      --green:    #16a34a;
      --green-dim:#dcfce7;
      --red:      #dc2626;
      --red-dim:  #fee2e2;
      --amber:    #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--ink);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .brand span { color: var(--teal-hi); }
    .brand-sub {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--ink-dim);
      letter-spacing: 0.04em;
    }

    /* ── NAV ── */
    nav {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      display: flex;
      flex-shrink: 0;
    }
    nav button {
      flex: 1;
      padding: 14px 6px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      color: var(--ink-dim);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    nav button.active {
      color: var(--teal);
      border-bottom-color: var(--teal);
    }

    /* ── VIEWS ── */
    .view { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding: 16px; gap: 12px; }
    .view.active { display: flex; }

    /* ── BUTTONS ── */
    .btn {
      width: 100%; padding: 16px;
      border: none; border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: filter 0.12s;
      letter-spacing: -0.01em;
    }
    .btn:active { filter: brightness(0.88); }
    .btn-primary { background: var(--teal);  color: #fff; }
    .btn-green   { background: var(--green); color: #fff; }
    .btn-outline {
      background: none;
      border: 2px solid var(--teal);
      color: var(--teal);
      padding: 14px;
    }
    .btn-ghost {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--ink-mid);
      font-weight: 600;
      padding: 13px;
    }
    .btn-danger {
      background: none;
      border: 1.5px solid var(--red);
      color: var(--red);
      font-weight: 600;
      padding: 13px;
    }

    /* ── SCANNER VIEW ── */
    #scanner-view { align-items: center; }

    #camera-wrap {
      position: relative;
      width: 100%; max-width: 380px;
      border-radius: 12px; overflow: hidden;
      border: 2px solid var(--border);
      background: var(--ink);
      aspect-ratio: 1;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    #preview { width: 100%; height: 100%; object-fit: cover; display: block; }
    #scan-canvas { display: none; }

    .scan-frame { position: absolute; inset: 0; pointer-events: none; }
    .scan-frame::before, .scan-frame::after,
    .scan-frame span::before, .scan-frame span::after {
      content: ''; position: absolute; width: 32px; height: 32px;
      border-color: var(--teal-hi); border-style: solid;
    }
    .scan-frame::before      { top: 16px; left: 16px;  border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .scan-frame::after       { top: 16px; right: 16px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .scan-frame span::before { bottom: 16px; left: 16px;  border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .scan-frame span::after  { bottom: 16px; right: 16px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    #scan-status {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink-dim);
      text-align: center;
      min-height: 1.5em;
    }

    /* Transaction Bar */
    #txn-bar {
      width: 100%; max-width: 380px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .txn-label { font-size: 0.72rem; font-weight: 700; color: var(--ink-dim); letter-spacing: 0.06em; text-transform: uppercase; }
    .txn-total { font-size: 2rem; font-weight: 800; color: var(--ink); line-height: 1; margin-top: 2px; letter-spacing: -0.03em; }
    .txn-count { font-size: 0.82rem; font-weight: 500; color: var(--ink-dim); margin-top: 3px; }

    #checkout-btn {
      padding: 14px 22px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: filter 0.12s;
      box-shadow: 0 2px 8px rgba(22,163,74,0.25);
    }
    #checkout-btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
    #checkout-btn:not(:disabled):active { filter: brightness(0.88); }

    /* ── MODALS ── */
    .modal {
      position: fixed; inset: 0;
      background: rgba(15,25,35,0.7);
      backdrop-filter: blur(4px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; gap: 14px; z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity 0.18s;
    }
    .modal.show { opacity: 1; pointer-events: all; }
    .modal-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    /* Sale flash */
    .flash-sku {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.08em;
    }
    .flash-name {
      font-size: 2.4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.03em;
      text-align: center;
    }
    .flash-price {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--teal-hi);
      letter-spacing: -0.02em;
    }

    /* Qty stepper */
    .qty-stepper {
      display: flex;
      align-items: stretch;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      overflow: hidden;
    }
    .qty-stepper button {
      width: 56px; height: 56px;
      background: none; border: none;
      color: #fff;
      font-size: 1.6rem;
      font-weight: 300;
      cursor: pointer;
      transition: background 0.12s;
    }
    .qty-stepper button:active { background: rgba(255,255,255,0.15); }
    .qty-stepper input {
      width: 64px; height: 56px;
      background: none; border: none;
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 1.4rem;
      font-weight: 500;
      text-align: center;
    }
    .qty-stepper input::-webkit-outer-spin-button,
    .qty-stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .qty-stepper input[type=number] { -moz-appearance: textfield; }

    .flash-btns { display: flex; gap: 10px; width: 100%; max-width: 380px; margin-top: 4px; }
    .flash-btns .btn-green { flex: 2; font-size: 1rem; padding: 16px; }
    .flash-btns .btn-ghost { flex: 1; color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.2); }

    /* Checkout modal */
    .checkout-items {
      width: 100%; max-width: 380px;
      max-height: 38vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px;
    }
    .checkout-row {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .cr-name  { font-size: 1rem; font-weight: 600; color: #fff; }
    .cr-qty   { font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-top: 2px; font-family: 'DM Mono', monospace; }
    .cr-price { font-size: 1.1rem; font-weight: 700; color: var(--teal-hi); font-family: 'DM Mono', monospace; }

    .checkout-total-row {
      width: 100%; max-width: 380px;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 14px;
      color: #fff;
    }
    .checkout-total-row span:first-child { font-size: 1.1rem; font-weight: 700; }
    .checkout-total-row span:last-child  { font-size: 1.6rem; font-weight: 800; color: var(--green); font-family: 'DM Mono', monospace; letter-spacing: -0.02em; }

    .modal-btns { display: flex; gap: 10px; width: 100%; max-width: 380px; }

    /* Add item modal */
    .modal-field { width: 100%; max-width: 380px; }
    .modal-field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .modal-field input {
      width: 100%; padding: 14px 16px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 500;
      outline: none;
    }
    .modal-field input:focus { border-color: var(--teal-hi); }
    .sku-preview {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
      margin-top: 6px;
      letter-spacing: 0.04em;
    }

    /* ── ITEMS VIEW ── */
    .item-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .item-card-header {
      padding: 16px 18px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer;
    }
    .item-card-header:active { background: var(--bg); }
    .iname  { font-size: 1.05rem; font-weight: 700; color: var(--ink); }
    .isku   { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--ink-dim); margin-top: 3px; letter-spacing: 0.04em; }
    .iprice { font-family: 'DM Mono', monospace; font-size: 1.2rem; font-weight: 500; color: var(--ink); }

    .item-card-body { display: none; padding: 16px 18px; border-top: 1.5px solid var(--border); flex-direction: column; gap: 14px; background: var(--bg); }
    .item-card-body.open { display: flex; }
    .qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .qr-label { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--ink-dim); letter-spacing: 0.04em; }
    .section-label { font-size: 0.72rem; font-weight: 700; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }

    .price-edit-row { display: flex; gap: 8px; }
    .price-edit-row input {
      flex: 1; padding: 12px 14px;
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px;
      color: var(--ink); font-family: 'DM Mono', monospace; font-size: 1.05rem;
      outline: none;
    }
    .price-edit-row input:focus { border-color: var(--teal); }
    .price-edit-row .save-btn {
      padding: 12px 18px;
      background: var(--teal); border: none; border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem; font-weight: 700; color: #fff; cursor: pointer;
    }

    /* ── LOG VIEW ── */
    .log-summary {
      background: var(--ink);
      border-radius: 10px;
      padding: 18px 20px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
    .slabel { font-size: 0.72rem; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 0.06em; text-transform: uppercase; }
    .svalue { font-size: 1.8rem; font-weight: 800; color: #fff; letter-spacing: -0.03em; line-height: 1.1; }

    .txn-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .txn-card-header {
      padding: 16px 18px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer;
    }
    .txn-card-header:active { background: var(--bg); }
    .txn-id   { font-family: 'DM Mono', monospace; font-size: 1rem; font-weight: 500; color: var(--teal); letter-spacing: 0.04em; }
    .txn-time { font-size: 0.78rem; font-weight: 500; color: var(--ink-dim); margin-top: 3px; }
    .txn-rev  { font-family: 'DM Mono', monospace; font-size: 1.2rem; font-weight: 500; color: var(--ink); }

    .txn-card-body { display: none; padding: 12px 18px; border-top: 1.5px solid var(--border); flex-direction: column; gap: 0; background: var(--bg); }
    .txn-card-body.open { display: flex; }
    .txn-line {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.95rem; padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .txn-line:last-child { border-bottom: none; }
    .txn-line .tl-name { font-weight: 600; color: var(--ink); }
    .txn-line .tl-qty  { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--ink-dim); margin-top: 2px; }
    .txn-line .tl-price { font-family: 'DM Mono', monospace; font-weight: 500; color: var(--ink); }

    .empty-state {
      text-align: center; color: var(--ink-dim);
      font-size: 1rem; font-weight: 500;
      padding: 48px 20px;
    }
    .version-mark { text-align: center; padding: 16px; font-size: 1.3rem; opacity: 0.3; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="brand">Merch<span>POS</span></div>
    <div class="brand-sub">POINT OF SALE</div>
  </div>
</header>

<nav>
  <button class="active" data-view="scanner">SCANNER</button>
  <button data-view="items">ITEMS</button>
  <button data-view="log">SALES LOG</button>
</nav>

<!-- SCANNER VIEW -->
<div id="scanner-view" class="view active">
  <div id="camera-wrap">
    <video id="preview" playsinline autoplay muted></video>
    <canvas id="scan-canvas"></canvas>
    <div class="scan-frame"><span></span></div>
  </div>
  <button class="btn btn-primary" id="start-btn" onclick="startCamera()">Start Camera</button>
  <div id="scan-status">Tap Start Camera to begin scanning</div>
  <div id="txn-bar">
    <div>
      <div class="txn-label">Transaction Total</div>
      <div class="txn-total" id="txn-total">$0.00</div>
      <div class="txn-count" id="txn-count">0 items</div>
    </div>
    <button id="checkout-btn" onclick="openCheckout()" disabled>Checkout</button>
  </div>
</div>

<!-- ITEMS VIEW -->
<div id="items-view" class="view">
  <div id="item-list"></div>
  <button class="btn btn-outline" onclick="openAddModal()">+ Add New Item</button>
</div>

<!-- LOG VIEW -->
<div id="log-view" class="view">
  <div class="log-summary">
    <div><div class="slabel">Transactions</div><div class="svalue" id="log-txn-count">0</div></div>
    <div style="text-align:right"><div class="slabel">Revenue</div><div class="svalue" id="log-revenue">$0.00</div></div>
  </div>
  <button class="btn btn-outline" onclick="exportCSV()">⬇ Export Sales CSV</button>
  <div id="txn-list"></div>
  <button class="btn btn-ghost" onclick="clearLog()">Clear All Sales Data</button>
</div>

<!-- SALE FLASH MODAL -->
<div id="sale-flash" class="modal">
  <div class="flash-sku"   id="flash-sku"></div>
  <div class="flash-name"  id="flash-name"></div>
  <div class="flash-price" id="flash-price"></div>
  <div class="qty-stepper">
    <button onclick="adjustQty(-1)">−</button>
    <input id="flash-qty" type="number" value="1" min="1" />
    <button onclick="adjustQty(1)">+</button>
  </div>
  <div class="flash-btns">
    <button class="btn btn-green" onclick="addToTransaction()">+ Add to Transaction</button>
    <button class="btn btn-ghost" onclick="dismissFlash()">Cancel</button>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div id="checkout-modal" class="modal">
  <div class="modal-title">Checkout</div>
  <div class="checkout-items" id="checkout-items"></div>
  <div class="checkout-total-row">
    <span>Total</span>
    <span id="checkout-total"></span>
  </div>
  <div class="modal-btns">
    <button class="btn btn-green"  onclick="saveTransaction()" style="flex:2">Save Transaction</button>
    <button class="btn btn-ghost"  onclick="closeCheckout()"   style="flex:1">Cancel</button>
  </div>
  <button class="btn btn-danger" onclick="voidTransaction()">Void Transaction</button>
</div>

<!-- ADD ITEM MODAL -->
<div id="add-modal" class="modal">
  <div class="modal-title">New Item</div>
  <div class="modal-field">
    <label>Item Name</label>
    <input id="new-name" type="text" placeholder="e.g. Coffee Mug" oninput="previewSKU()" />
    <div class="sku-preview" id="sku-preview">SKU: —</div>
  </div>
  <div class="modal-field">
    <label>Price ($)</label>
    <input id="new-price" type="number" min="0" step="0.01" placeholder="0.00" />
  </div>
  <div class="modal-btns">
    <button class="btn btn-primary" onclick="addItem()" style="flex:2">Add Item</button>
    <button class="btn btn-ghost"   onclick="closeAddModal()" style="flex:1">Cancel</button>
  </div>
</div>

<div class="version-mark">🏪</div>

<script>
  // ── STATE ──
  const DEFAULTS = [
    { sku: 'SWORD',  name: 'Sword',  price: 2.00 },
    { sku: 'POTION', name: 'Potion', price: 1.50 },
    { sku: 'ARROWS', name: 'Arrows', price: 0.50 },
  ];

  let items        = JSON.parse(localStorage.getItem('merch_items') || 'null') || DEFAULTS;
  let sales        = JSON.parse(localStorage.getItem('merch_sales') || '[]');
  let transaction  = [];
  let pendingItem  = null;
  let scanning     = false;
  let lastScanTime = 0;
  let detector     = null;

  function saveItems() { localStorage.setItem('merch_items', JSON.stringify(items)); }
  function saveSales() { localStorage.setItem('merch_sales', JSON.stringify(sales)); }
  function getItem(sku) { return items.find(i => i.sku === sku); }

  // ── LEAVE WARNING ──
  window.addEventListener('beforeunload', e => { e.preventDefault(); e.returnValue = ''; });

  // ── NAV ──
  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.view + '-view').classList.add('active');
      if (btn.dataset.view === 'items') renderItems();
      if (btn.dataset.view === 'log')   renderLog();
    });
  });

  // ── SCANNER ──
  async function startCamera() {
    if (!('BarcodeDetector' in window)) {
      document.getElementById('scan-status').textContent = 'BarcodeDetector not supported on this browser.';
      return;
    }
    detector = new BarcodeDetector({ formats: ['qr_code'] });
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 } }
      });
      document.getElementById('preview').srcObject = stream;
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('scan-status').textContent = 'Scanning…';
      scanning = true;
      setTimeout(tick, 200);
    } catch {
      document.getElementById('scan-status').textContent = 'Camera access denied.';
    }
  }

  async function tick() {
    if (!scanning) return;
    const video = document.getElementById('preview');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      try {
        const codes = await detector.detect(video);
        if (codes.length > 0 && Date.now() - lastScanTime > 2000) {
          lastScanTime = Date.now();
          handleScan(codes[0].rawValue.trim().toUpperCase());
        }
      } catch { /* frame skip */ }
    }
    setTimeout(tick, 200);
  }

  function handleScan(sku) {
    const item = getItem(sku);
    if (!item) { document.getElementById('scan-status').textContent = `Unknown: ${sku}`; return; }
    pendingItem = item;
    document.getElementById('flash-sku').textContent   = sku;
    document.getElementById('flash-name').textContent  = item.name;
    document.getElementById('flash-price').textContent = '$' + item.price.toFixed(2);
    document.getElementById('sale-flash').classList.add('show');
  }

  function dismissFlash() {
    document.getElementById('sale-flash').classList.remove('show');
    document.getElementById('flash-qty').value = 1;
    pendingItem = null;
  }

  // ── TRANSACTION ──
  function txnTotal() { return transaction.reduce((s, i) => s + i.price, 0); }

  function updateTxnBar() {
    const n = transaction.length;
    document.getElementById('txn-total').textContent = '$' + txnTotal().toFixed(2);
    document.getElementById('txn-count').textContent = n === 1 ? '1 item' : `${n} items`;
    document.getElementById('checkout-btn').disabled = n === 0;
  }

  function adjustQty(delta) {
    const input = document.getElementById('flash-qty');
    input.value = Math.max(1, parseInt(input.value || 1) + delta);
  }

  function addToTransaction() {
    if (!pendingItem) return;
    const qty = Math.max(1, parseInt(document.getElementById('flash-qty').value) || 1);
    for (let i = 0; i < qty; i++) {
      transaction.push({ sku: pendingItem.sku, name: pendingItem.name, price: pendingItem.price });
    }
    updateTxnBar();
    const name = pendingItem.name;
    dismissFlash();
    document.getElementById('scan-status').textContent = `+ ${qty > 1 ? qty + 'x ' : ''}${name} added`;
    setTimeout(() => { if (scanning) document.getElementById('scan-status').textContent = 'Scanning…'; }, 1200);
  }

  function openCheckout() {
    const grouped = groupItems(transaction);
    document.getElementById('checkout-items').innerHTML = grouped.map(g => `
      <div class="checkout-row">
        <div>
          <div class="cr-name">${g.name}</div>
          <div class="cr-qty">x${g.qty} @ $${g.price.toFixed(2)}</div>
        </div>
        <div class="cr-price">$${(g.price * g.qty).toFixed(2)}</div>
      </div>`).join('');
    document.getElementById('checkout-total').textContent = '$' + txnTotal().toFixed(2);
    document.getElementById('checkout-modal').classList.add('show');
  }

  function closeCheckout() { document.getElementById('checkout-modal').classList.remove('show'); }

  function generateTxnId() {
    const now = new Date();
    const mmdd = String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
    const prefix = mmdd + '-';
    const todayCount = sales.filter(t => t.txnId && t.txnId.startsWith(prefix)).length;
    return prefix + String(todayCount + 1).padStart(2, '0');
  }

  function saveTransaction() {
    const txnId = generateTxnId();
    const time  = new Date().toISOString();
    sales.push({ txnId, time, items: groupItems(transaction) });
    saveSales();
    transaction = [];
    updateTxnBar();
    closeCheckout();
    document.getElementById('scan-status').textContent = `✓ ${txnId} saved!`;
    setTimeout(() => { if (scanning) document.getElementById('scan-status').textContent = 'Scanning…'; }, 1500);
  }

  function voidTransaction() {
    if (!confirm('Void this transaction? All scanned items will be lost.')) return;
    transaction = [];
    updateTxnBar();
    closeCheckout();
    document.getElementById('scan-status').textContent = 'Transaction voided.';
    setTimeout(() => { if (scanning) document.getElementById('scan-status').textContent = 'Scanning…'; }, 1500);
  }

  function groupItems(arr) {
    const map = {};
    arr.forEach(i => {
      if (!map[i.sku]) map[i.sku] = { sku: i.sku, name: i.name, price: i.price, qty: 0 };
      map[i.sku].qty++;
    });
    return Object.values(map);
  }

  // ── ITEMS ──
  function renderItems() {
    const list = document.getElementById('item-list');
    list.innerHTML = '';
    items.forEach(item => {
      const sold = sales.filter(t => t.txnId && t.items)
        .reduce((n, t) => n + t.items.filter(i => i.sku === item.sku).reduce((s, i) => s + i.qty, 0), 0);
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `
        <div class="item-card-header" onclick="toggleItemCard(this, '${item.sku}')">
          <div>
            <div class="iname">${item.name}</div>
            <div class="isku">${item.sku} &middot; ${sold} sold</div>
          </div>
          <div class="iprice">$${item.price.toFixed(2)}</div>
        </div>
        <div class="item-card-body">
          <div class="qr-wrap">
            <div id="qr-${item.sku}"></div>
            <div class="qr-label">Scan content: ${item.sku}</div>
          </div>
          <div>
            <div class="section-label">Edit Price</div>
            <div class="price-edit-row">
              <input type="number" min="0" step="0.01" value="${item.price.toFixed(2)}" id="price-${item.sku}" />
              <button class="save-btn" onclick="updatePrice('${item.sku}')">Save</button>
            </div>
          </div>
        </div>`;
      list.appendChild(card);
    });
  }

  function toggleItemCard(header, sku) {
    const body = header.nextElementSibling;
    const isOpen = body.classList.toggle('open');
    if (isOpen) {
      const el = document.getElementById('qr-' + sku);
      if (el && !el.hasChildNodes()) {
        new QRCode(el, { text: sku, width: 160, height: 160, colorDark: '#0f1923', colorLight: '#f4f5f7' });
      }
    }
  }

  function updatePrice(sku) {
    const val = parseFloat(document.getElementById('price-' + sku).value);
    if (isNaN(val) || val < 0) { alert('Invalid price.'); return; }
    getItem(sku).price = val;
    saveItems();
    renderItems();
  }

  // ── ADD ITEM ──
  function generateSKU(name) {
    const base = name.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7);
    let sku = base, n = 1;
    while (items.find(i => i.sku === sku)) { sku = base + (++n); }
    return sku;
  }

  function previewSKU() {
    const name = document.getElementById('new-name').value.trim();
    document.getElementById('sku-preview').textContent = name ? 'SKU: ' + generateSKU(name) : 'SKU: —';
  }

  function openAddModal()  { document.getElementById('add-modal').classList.add('show'); }
  function closeAddModal() {
    document.getElementById('add-modal').classList.remove('show');
    document.getElementById('new-name').value  = '';
    document.getElementById('new-price').value = '';
    document.getElementById('sku-preview').textContent = 'SKU: —';
  }

  function addItem() {
    const name  = document.getElementById('new-name').value.trim();
    const price = parseFloat(document.getElementById('new-price').value);
    if (!name)                     { alert('Enter an item name.');   return; }
    if (isNaN(price) || price < 0) { alert('Enter a valid price.'); return; }
    items.push({ sku: generateSKU(name), name, price });
    saveItems();
    closeAddModal();
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelector('[data-view="items"]').classList.add('active');
    document.getElementById('items-view').classList.add('active');
    renderItems();
  }

  // ── LOG ──
  function renderLog() {
    const valid = sales.filter(t => t.txnId && t.items);
    const totalRev = valid.reduce((s, t) => s + t.items.reduce((r, i) => r + i.price * i.qty, 0), 0);
    document.getElementById('log-txn-count').textContent = valid.length;
    document.getElementById('log-revenue').textContent   = '$' + totalRev.toFixed(2);

    const list = document.getElementById('txn-list');
    if (!valid.length) { list.innerHTML = '<div class="empty-state">No transactions yet.</div>'; return; }

    const sorted = [...valid].sort((a, b) => a.txnId.localeCompare(b.txnId)).reverse();
    list.innerHTML = sorted.map(t => {
      const rev  = t.items.reduce((s, i) => s + i.price * i.qty, 0);
      const time = new Date(t.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const lines = t.items.map(i => `
        <div class="txn-line">
          <div><div class="tl-name">${i.name}</div><div class="tl-qty">x${i.qty} @ $${i.price.toFixed(2)}</div></div>
          <div class="tl-price">$${(i.price * i.qty).toFixed(2)}</div>
        </div>`).join('');
      return `
        <div class="txn-card">
          <div class="txn-card-header" onclick="this.nextElementSibling.classList.toggle('open')">
            <div>
              <div class="txn-id">${t.txnId}</div>
              <div class="txn-time">${time}</div>
            </div>
            <div class="txn-rev">$${rev.toFixed(2)}</div>
          </div>
          <div class="txn-card-body">${lines}</div>
        </div>`;
    }).join('');
  }

  function exportCSV() {
    if (!sales.length) { alert('No sales to export.'); return; }
    const valid  = sales.filter(t => t.txnId && t.items);
    const sorted = [...valid].sort((a, b) => a.txnId.localeCompare(b.txnId));
    const rows   = [['Transaction', 'Time', 'Item', 'SKU', 'Qty', 'Unit Price', 'Line Total']];
    sorted.forEach(t => {
      t.items.forEach(i => {
        rows.push([t.txnId, t.time, i.name, i.sku, i.qty, i.price.toFixed(2), (i.price * i.qty).toFixed(2)]);
      });
    });
    const suffix = Math.random().toString(36).slice(2, 7).toUpperCase();
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(rows.map(r => r.join(',')).join('\n'));
    a.download = 'sales_' + new Date().toISOString().slice(0, 10) + '_' + suffix + '.csv';
    a.click();
  }

  function clearLog() {
    if (!confirm('Clear ALL sales data? This cannot be undone.')) return;
    sales = []; saveSales(); renderLog();
  }
</script>
</body>
</html>
